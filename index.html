<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vimeo Test</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: sans-serif;
      background: #111;
      color: #fff;
    }

    .video-wrapper {
      max-width: 800px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <h1>Vimeo Embed Test</h1>

  <div class="video-wrapper">
    <iframe 
      src="https://player.vimeo.com/video/159606491?dnt=1&title=0&byline=0&portrait=0&color=dd5424"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
